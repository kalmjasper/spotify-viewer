<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title description">
  <title id="title">Layout preview cover</title>
  <desc id="description">Abstract overlapping circles on a dark gradient</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="0.55" stop-color="#581c87"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#1ed760"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#background)"/>
  <circle cx="530" cy="250" r="225" fill="#f472b6" opacity=".74"/>
  <circle cx="285" cy="520" r="260" fill="url(#disc)" opacity=".82"/>
  <circle cx="400" cy="400" r="112" fill="#111827" opacity=".9"/>
  <circle cx="400" cy="400" r="28" fill="#f8fafc"/>
</svg>
